<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:url" content="{{ canonical }}">
{{ og_extra }}
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<style>
/* The homepage's bones: white, one centred column. This page is a
   HighExplosive page presenting ComStar Entertainment material — not a
   pretend document. Recognition comes from the navy, the chequer, the seal
   and the display face, not from simulating paper. */

/* Anta, the same display face the comparator uses. Served rather than inlined:
   this page is not the standalone file the comparator is. */
@font-face{font-family:"HXDisplay";src:url("/fonts/Anta-Regular.ttf") format("truetype");
           font-weight:400;font-style:normal;font-display:swap}

:root{
  --paper:#FFFFFF;      /* the ground */
  --ink:#031F31;        /* body prose, chequer squares */
  --navy:#003E5C;       /* h1, h2, memo labels, signature, links, seal */
  --muted:#5A6B76;      /* standfirst, preamble, file meta, footer */
  --rule:#D3DDE4;       /* card borders and general hairlines */
  --rule-firm:#9FB2BE;  /* memo header only, where a document reading is wanted */
  --thunder:#E47E28;    /* inside the Thunder mark, and link hover */
  --crossfire:#A12015;  /* inside the Crossfire mark only */

  --display:"HXDisplay",ui-sans-serif,system-ui,sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* There is no page-level accent. Both candidates are already claimed — orange
   is Formula Thunder, red is Formula Crossfire — so a page accent in either
   would brand the whole page as one series. Links are navy instead, at 11.4:1,
   and each colour on the page means exactly one thing. */

*{box-sizing:border-box}
body{margin:0;padding:2.5rem 1.25rem 4rem;background:var(--paper);color:var(--ink);
  font:16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:34rem;margin:0 auto}

.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;
  padding:10px 16px;font-weight:700;z-index:10}
.skip:focus{left:0}

/* The back link and the footer are the real world. Plain, quiet, no display
   face and no small caps — they should not sound like the material. */
.back{display:inline-block;font-size:.8125rem;color:var(--muted);
  text-decoration:none;margin-bottom:2.5rem}
.back:hover{color:var(--navy)}

/* ------------------------------------------------------- masthead
   Seal in a fixed left gutter; heading and standfirst take the remaining
   width; the chequer runs the full column beneath both. The gutter is fixed
   rather than fluid so the vacant channel either side of the seal stays
   constant — that channel is what makes it read as a seal and not a badge. */
.masthead{display:grid;grid-template-columns:64px 1fr;gap:1.25rem;align-items:start}
.masthead .seal{width:64px;height:auto;display:block}
.masthead h1{margin:0 0 .55rem}
.masthead .standfirst{margin:0}

h1{font-family:var(--display);font-size:23px;line-height:1.2;letter-spacing:.09em;
  font-weight:400;text-transform:uppercase;color:var(--navy)}

/* Two 45° gradients rather than an image: no request, crisp at any zoom.
   Neither black nor navy — navy at this size loses the snap a chequered device
   depends on, and nothing else on the page is black. This value must match the
   pack exactly; it is the one element that appears in both. */
.chequer{height:12px;margin:1.15rem 0 1rem;
  background-image:
    linear-gradient(45deg,var(--ink) 25%,transparent 25%,transparent 75%,var(--ink) 75%),
    linear-gradient(45deg,var(--ink) 25%,transparent 25%,transparent 75%,var(--ink) 75%);
  background-size:12px 12px;background-position:0 0,6px 6px}

.standfirst{color:var(--muted);font-size:.9375rem}

/* The hero carries the gap to whatever follows. A caption is optional, so when
   one is present it is pulled back up under the image. */
.hero{width:100%;height:auto;display:block;margin:1.75rem 0 3rem}
.caption{color:var(--muted);font-size:.75rem;text-align:center;
  margin:-2.5rem 0 3rem;letter-spacing:.02em}

.memo-head{border-top:1px solid var(--rule-firm);border-bottom:1px solid var(--rule-firm);
  padding:.9rem 0;margin:0 0 2rem;font-size:.8125rem;line-height:1.9;letter-spacing:.02em}
.memo-head span{display:block}
.memo-head b{display:inline-block;min-width:3.5rem;color:var(--navy);font-weight:400;
  font-family:var(--display);font-size:.6875rem;letter-spacing:.09em;text-transform:uppercase}

.memo p{margin:0 0 1.15rem}
.signoff{margin-top:2rem;font-size:.9375rem;line-height:1.55}
.signoff .name{font-weight:600;color:var(--navy)}
.signoff .role{color:var(--muted);font-style:italic;display:block}

h2{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:400;color:var(--navy);margin:3.5rem 0 1rem}
.preamble{color:var(--muted);font-size:.9375rem;margin:0 0 2rem}

/* ---------------------------------------------- one card per series */
.card{border:1px solid var(--rule);padding:1.75rem 1.5rem 1.25rem;margin:0 0 1.5rem}

/* Three marks of very different proportion — 1.18:1, 3.95:1 and 0.84:1 — have
   to read as siblings, so neither width nor height alone can govern. Height
   caps the tall ones; the width cap stops the wide Crossfire lockup spanning
   the card. A series may lower its own height cap: the Division seal does,
   because it is authority rather than merchandise and should not compete with
   the two commercial marks beside it. */
.card .mark{display:block;margin:0 auto 1.25rem;
  width:auto;height:auto;max-height:140px;max-width:66%}
.card .name{font-family:var(--display);font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:400;text-align:center;color:var(--navy);
  margin:0 0 1.25rem}
.card .blurb{font-size:.9375rem;margin:0 0 1.5rem}
.card .blurb p{margin:0 0 .7rem}
.card .blurb p:last-child{margin-bottom:0}
.card .files{border-top:1px solid var(--rule);padding-top:1.25rem}

.item{margin:0 0 1.1rem;display:flex;gap:1rem;align-items:flex-start;
  justify-content:space-between}
.item:last-child{margin-bottom:0}
.item .txt{flex:1 1 auto;min-width:0}
/* Thumbnails on the right. On the left, an entry without one leaves a phantom
   gap and the titles stop aligning. */
.item .thumb{flex:0 0 150px;border:1px solid var(--rule);line-height:0}
.item .thumb img{width:100%;height:auto}

/* Persistent underline in navy at ~35%, thickening to orange on hover while
   the text stays navy. The hover colour is the house orange, which cannot be
   a text colour at 2.87:1 but is fine as a rule. */
.item a{color:var(--navy);text-decoration:none;font-weight:600;
  border-bottom:1px solid rgba(0,62,92,.35)}
.item a:hover,.item a:focus-visible{border-bottom:2px solid var(--thunder)}
.item .pending{color:var(--muted);font-style:italic;font-weight:600}
.item .meta{display:block;color:var(--muted);font-size:.8125rem;margin-top:.15rem}

footer{margin-top:4rem;padding-top:1.25rem;border-top:1px solid var(--rule);
  color:var(--muted);font-size:.75rem}

@media (max-width:480px){
  body{padding-top:1.75rem}
  h1{font-size:19px}
  .masthead{grid-template-columns:48px 1fr;gap:1rem}
  .masthead .seal{width:48px}
  .item .thumb{flex-basis:104px}
}
@media print{
  body{padding:0}
  .back,.skip{display:none}
  .item a{color:#000;border-bottom:none}
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<div class="wrap" id="main">

  <a class="back" href="/">&larr; {{ back_label }}</a>

  <div class="masthead">
{{ seal }}
    <div class="masthead-text">
      <h1>{{ title }}</h1>
      <p class="standfirst">{{ standfirst }}</p>
    </div>
  </div>
  <div class="chequer"></div>

  {{ hero }}
  {{ caption }}

  <div class="memo-head">
{{ memo_head }}
  </div>

  <div class="memo">
{{ content }}
  </div>

  {{ signoff }}

  <h2>{{ schedule_heading }}</h2>
  <p class="preamble">{{ preamble }}</p>

{{ schedule }}

  <footer>{{ legal_short }}</footer>

</div>

</body>
</html>
